name: Publicar en Play

# Mismo patrón que TakeSync y Flixer (docs/play/release.md, «Publicación automática»):
# - merge a main  → AAB firmado a la pista interna;
# - tag v*        → producción con lanzamiento escalonado del 20 % (se sube al 100 % en Play Console);
# - a mano        → la pista y el estado que se elijan en Actions.
# La firma, la cuenta de servicio y los IDs de AdMob salen del environment `play-store`.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      track:
        description: "Pista de Play"
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      status:
        description: "Estado de la versión (draft deja la versión sin publicar en Play Console)"
        type: choice
        options: [completed, inProgress, draft]
        default: completed

permissions:
  contents: read

concurrency:
  group: play-store
  cancel-in-progress: false

env:
  PACKAGE_NAME: com.gonisoma.trainloop
  PUB_HOSTED_URL: https://pub.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: play-store
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.x
          cache: true

      # versionName: el de pubspec.yaml (un tag v* tiene que coincidir con él).
      # versionCode: número de ejecución + desplazamiento, siempre creciente y por encima de los
      # subidos a mano (el 2 fue la 1.0.0). El +N de pubspec solo elige el archivo de novedades.
      - name: Versión, pista y estado
        id: version
        env:
          OFFSET: ${{ vars.VERSION_CODE_OFFSET || '100' }}
          INPUT_TRACK: ${{ inputs.track }}
          INPUT_STATUS: ${{ inputs.status }}
        run: |
          raw="$(grep -E '^version:' pubspec.yaml | awk '{print $2}')"
          name="${raw%%+*}"
          notes="${raw##*+}"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "${GITHUB_REF_NAME#v}" != "$name" ]]; then
            echo "::error::El tag $GITHUB_REF_NAME no coincide con version: $raw de pubspec.yaml."
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            track="$INPUT_TRACK"; status="$INPUT_STATUS"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            track="production"; status="inProgress"
          else
            track="internal"; status="completed"
          fi
          code=$(( GITHUB_RUN_NUMBER + OFFSET ))
          {
            echo "name=$name"
            echo "code=$code"
            echo "notes=$notes"
            echo "track=$track"
            echo "status=$status"
          } >> "$GITHUB_OUTPUT"
          echo "Trainloop $name ($code) → $track, $status"

      # android/app/build.gradle.kts lee TL_KEYSTORE_PATH, TL_KEYSTORE_PASSWORD, TL_KEY_ALIAS y
      # TL_KEY_PASSWORD del entorno.
      - name: Llave de subida
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::Falta el secret ANDROID_KEYSTORE_BASE64 en el environment play-store."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          echo "TL_KEYSTORE_PATH=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"

      - name: Dependencias
        run: flutter pub get --enforce-lockfile

      - name: Pruebas
        timeout-minutes: 5
        run: flutter test

      # verifyReleaseAdIds (Gradle) hace fallar el build si falta algún ID real de AdMob.
      - name: App bundle firmado
        env:
          TL_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TL_ADMOB_APP_ID: ${{ vars.TL_ADMOB_APP_ID }}
          BANNER_ID: ${{ vars.TL_ADMOB_BANNER_ID }}
          INTERSTITIAL_ID: ${{ vars.TL_ADMOB_INTERSTITIAL_ID }}
          INTERSTITIAL: ${{ vars.TL_INTERSTITIAL || 'off' }}
        run: |
          flutter build appbundle --release \
            --build-name="${{ steps.version.outputs.name }}" \
            --build-number="${{ steps.version.outputs.code }}" \
            --dart-define=TL_ADMOB_BANNER_ID="$BANNER_ID" \
            --dart-define=TL_ADMOB_INTERSTITIAL_ID="$INTERSTITIAL_ID" \
            --dart-define=TL_INTERSTITIAL="$INTERSTITIAL"

      # Sin secrets, Gradle firma con la llave de depuración: ese AAB no puede llegar a Play.
      - name: Comprobar la firma
        run: |
          aab=build/app/outputs/bundle/release/app-release.aab
          jarsigner -verify "$aab" | grep -q "jar verified"
          if keytool -printcert -jarfile "$aab" | grep -q "CN=Android Debug"; then
            echo "::error::El AAB está firmado con la llave de depuración."
            exit 1
          fi

      # Novedades: fastlane/metadata/android/<locale>/changelogs/<+N de pubspec>.txt
      # (test/tool/play_metadata_test.dart comprueba que existan y midan ≤ 500 caracteres).
      - name: Novedades
        run: |
          mkdir -p "$RUNNER_TEMP/whatsnew"
          for dir in fastlane/metadata/android/*/; do
            locale="$(basename "$dir")"
            file="$dir/changelogs/${{ steps.version.outputs.notes }}.txt"
            if [[ -f "$file" ]]; then
              cp "$file" "$RUNNER_TEMP/whatsnew/whatsnew-$locale"
            fi
          done
          ls "$RUNNER_TEMP/whatsnew"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trainloop-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/mapping/release/mapping.txt
          retention-days: 30

      - name: Subir a Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          mappingFile: build/app/outputs/mapping/release/mapping.txt
          releaseName: ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})
          tracks: ${{ steps.version.outputs.track }}
          status: ${{ steps.version.outputs.status }}
          userFraction: ${{ steps.version.outputs.status == 'inProgress' && '0.2' || '' }}
          whatsNewDirectory: ${{ runner.temp }}/whatsnew

      - name: Borrar la llave
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks"
