name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUB_HOSTED_URL: https://pub.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.x
          cache: true

      - name: Dependencias
        run: flutter pub get --enforce-lockfile

      - name: Localizaciones al día
        run: |
          dart run tool/pseudo_locale.dart
          flutter gen-l10n
          git diff --exit-code -- lib/l10n

      - name: Formato
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Análisis
        run: flutter analyze

      - name: Pruebas
        run: flutter test

      - name: APK de depuración
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: trainloop-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
