name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PUB_HOSTED_URL: https://pub.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.x
          cache: true

      - name: Dependencias
        run: flutter pub get --enforce-lockfile

      - name: Localizaciones al día
        run: |
          dart run tool/pseudo_locale.dart
          flutter gen-l10n
          git diff --exit-code -- lib/l10n

      - name: Código de Drift al día
        run: |
          dart run build_runner build
          dart run drift_dev schema generate --data-classes --companions drift_schemas/app_database/ test/drift/app_database/generated/
          changes=$(git status --porcelain -- lib test drift_schemas)
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "Regenera con build_runner y commitea el resultado."
            exit 1
          fi

      - name: Formato
        run: dart format --output=none --set-exit-if-changed lib test tool integration_test test_driver

      - name: Análisis
        run: flutter analyze

      - name: Pruebas
        # Toda la suite tarda ~15 s; si algo se cuelga, falla en minutos.
        timeout-minutes: 5
        run: flutter test

      - name: APK de depuración
        run: flutter build apk --debug

      - name: Pruebas del motor nativo (JVM)
        working-directory: android
        run: ./gradlew testDebugUnitTest

      - name: Guarda de IDs de AdMob
        # Un release con los IDs de prueba debe fallar (deuda 6 de D8).
        working-directory: android
        run: |
          if ./gradlew -q :app:verifyReleaseAdIds; then
            echo "La guarda dejó pasar los IDs de prueba." >&2
            exit 1
          fi
          echo "La guarda falla sin IDs reales, como debe."

      - name: Release con R8 (IDs de prueba permitidos)
        # La CI no tiene los IDs reales ni la llave de subida: compila el
        # release para probar R8 y la reducción, firmado con la llave de
        # depuración. Nunca subir este artefacto a Play.
        env:
          TL_ALLOW_TEST_ADS: 'true'
        run: |
          flutter build apk --release --split-per-abi
          flutter build appbundle --release

      - name: Tamaño del release (NF-11)
        run: |
          {
            echo "### Tamaño del release (NF-11: < 20 MB de descarga)"
            echo ""
            echo "| Archivo | Tamaño | gzip -9 (≈ descarga) |"
            echo "|---|---:|---:|"
            for f in build/app/outputs/flutter-apk/app-*-release.apk build/app/outputs/bundle/release/app-release.aab; do
              size=$(stat -c%s "$f")
              gz=$(gzip -9 -c "$f" | wc -c)
              awk -v n="$(basename "$f")" -v s="$size" -v g="$gz" \
                'BEGIN { printf "| %s | %.1f MB | %.1f MB |\n", n, s / 1000000, g / 1000000 }'
            done
            echo ""
            echo "El tamaño real de descarga lo informa Play Console (por dispositivo)."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: trainloop-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
