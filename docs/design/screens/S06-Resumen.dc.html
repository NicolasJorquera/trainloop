</helmet>
<div lang="{{lang}}" style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.ink}}; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">

    <sc-if value="{{isInt}}" hint-placeholder-val="{{true}}">
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">

        <div style="padding: 12px; background: {{t.sf}}; border-radius: 8px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; font-weight: 600; letter-spacing: 1px; color: {{t.ink2}}">{{s.rounds}}</span><span style="font-family: 'Barlow Condensed', sans-serif; font-size: 34px; font-weight: 800; line-height: 1">8/8</span></div>
        <div style="padding: 12px; background: {{t.sf}}; border-radius: 8px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; font-weight: 600; letter-spacing: 1px; color: {{t.ink2}}">{{s.work}}</span><span style="font-family: 'Barlow Condensed', sans-serif; font-size: 34px; font-weight: 800; line-height: 1">2:40</span></div>
      </div>

    <sc-if value="{{isStr}}" hint-placeholder-val="{{false}}">

    </sc-if>

    <section style="display: flex; flex-direction: column; gap: 8px" aria-label="{{s.rpeAria}}">
      <span style="font-size: 12px; font-weight: 600; letter-spacing: 1.2px; color: {{t.ink2}}">{{s.rpeQ}}</span>
      <div style="display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px">
        <sc-for list="{{rpe}}" as="r" hint-placeholder-count="10">
          <button type="button" onClick="{{r.pick}}" aria-pressed="{{r.on}}" aria-label="{{r.aria}}" style="height: 44px; border: 1px solid {{r.border}}; border-radius: 4px; background: {{r.bg}}; color: {{r.fg}}; font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 700; cursor: pointer; padding: 0">{{r.n}}</button>

      </div>
      <div style="display: flex; justify-content: space-between; font-size: 12px; color: {{t.ink2}}"><span>{{s.easy}}</span><span>{{s.max}}</span></div>

    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; letter-spacing: 1.2px; color: {{t.ink2}}">{{s.note}}
      <textarea rows="2" placeholder="{{s.notePh}}" style="padding: 12px; border: 1px solid {{t.line}}; border-radius: 6px; background: {{t.field}}; color: {{t.ink}}; font-family: Inter, system-ui, sans-serif; font-size: 15px; letter-spacing: 0; resize: none"></textarea>
    </label>
  </main>

  <footer style="flex-shrink: 0; padding: 12px 20px 24px; display: flex; flex-direction: column; gap: 4px">
    <a href="Main.dc.html" style="height: 56px; border-radius: 6px; background: {{t.priBg}}; color: {{t.priInk}}; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-size: 24px; font-weight: 800; text-transform: uppercase; text-decoration: none">{{s.done}}</a>
    <button type="button" onClick="{{askDiscard}}" style="height: 48px; border: 0; background: transparent; color: {{t.danger}}; font-family: Inter, system-ui, sans-serif; font-size: 15px; font-weight: 600; cursor: pointer">{{s.discard}}</button>
  </footer>

  <sc-if value="{{confirm}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box">
      <div role="alertdialog" aria-label="{{s.discardQ}}" style="width: 100%; padding: 24px; background: {{t.sf}}; border-radius: 8px; display: flex; flex-direction: column; gap: 12px">
        <h2 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 800; text-transform: uppercase">{{s.discardQ}}</h2>
        <p style="margin: 0; font-size: 15px; color: {{t.ink2}}">{{s.discardBody}}</p>
        <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px">
          <button type="button" onClick="{{cancel}}" style="height: 48px; padding: 0 16px; border: 0; background: transparent; color: {{t.accText}}; font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 700; text-transform: uppercase; cursor: pointer">{{s.cancel}}</button>
          <a href="Main.dc.html" style="height: 48px; padding: 0 18px; border-radius: 6px; background: {{t.danger}}; color: #0E0F11; display: flex; align-items: center; font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 800; text-transform: uppercase; text-decoration: none">{{s.discardBtn}}</a>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
