<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>A · Inicio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
</style>
</helmet>
<div lang="{{lang}}" style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.ink}}; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="height: 64px; padding: 0 8px 0 20px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0">
    <div style="display: flex; align-items: center; gap: 8px">
      <span style="width: 22px; height: 22px; border-radius: 4px; background: {{t.mark}}; display: flex; align-items: center; justify-content: center" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{t.markInk}}" stroke-width="3" stroke-linecap="round"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v4h4"></path></svg></span>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 26px; letter-spacing: 0.5px">TRAINLOOP</span>
    </div>
    <a href="S16-Configuracion.dc.html" aria-label="{{s.settings}}" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: {{t.ink}}">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>
    </a>
  </header>

  <main style="flex-grow: 1; padding: 4px 16px 0; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
    <section style="padding: 16px 16px 14px; background: {{t.sf}}; border-radius: 8px; display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 12px; font-weight: 600; letter-spacing: 1.2px; color: {{t.ink2}}">{{s.week}}</span>
      <div style="display: flex; align-items: flex-end; gap: 10px">
        <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 72px; line-height: 0.85">2<span style="color: {{t.ink2}}">/4</span></span>
        <span style="font-size: 14px; color: {{t.ink2}}; padding-bottom: 4px">{{s.sessions}}</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px" role="img" aria-label="{{s.progressAria}}">
        <span style="height: 8px; border-radius: 2px; background: {{t.barOn}}"></span>
        <span style="height: 8px; border-radius: 2px; background: {{t.barOn}}"></span>
        <span style="height: 8px; border-radius: 2px; background: {{t.barOff}}"></span>
        <span style="height: 8px; border-radius: 2px; background: {{t.barOff}}"></span>
      </div>
      <div style="display: flex; gap: 20px; font-size: 13px; color: {{t.ink2}}">
        <span><strong style="font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 700; color: {{t.ink}}">95</strong> {{s.mins}}</span>
        <span><strong style="font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 700; color: {{t.ink}}">3</strong> {{s.streak}}</span>
      </div>
    </section>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <a href="Dir-A-Timer.dc.html" style="height: 96px; padding: 14px; box-sizing: border-box; border-radius: 8px; background: {{t.priBg}}; color: {{t.priInk}}; text-decoration: none; display: flex; flex-direction: column; justify-content: space-between">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4v16l13-8z"></path></svg>
        <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 26px; line-height: 1; letter-spacing: 0.3px">{{s.startInt}}</span>
      </a>
      <a href="S10-SesionFuerza.dc.html" style="height: 96px; padding: 14px; box-sizing: border-box; border-radius: 8px; border: 2px solid {{t.ink}}; color: {{t.ink}}; text-decoration: none; display: flex; flex-direction: column; justify-content: space-between">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 7v10M3 9v6M18 7v10M21 9v6M6 12h12"></path></svg>
        <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 26px; line-height: 1; letter-spacing: 0.3px">{{s.startStr}}</span>
      </a>
    </div>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 1.2px; color: {{t.ink2}}">{{s.repeat}}</h2>
      <a href="S10-SesionFuerza.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 0 12px 0 14px; border-radius: 8px; background: {{t.sf}}; color: {{t.ink}}; text-decoration: none">
        <span style="width: 4px; height: 36px; border-radius: 2px; background: {{t.str}}" aria-hidden="true"></span>
        <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
          <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 700">{{s.lastName}}</span>
          <span style="font-size: 13px; color: {{t.ink2}}">{{s.lastMeta}}</span>
        </span>
        <span style="width: 44px; height: 44px; border-radius: 22px; background: {{t.priBg}}; color: {{t.priInk}}; display: flex; align-items: center; justify-content: center" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"></path></svg></span>
      </a>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 1.2px; color: {{t.ink2}}">{{s.templates}}</h2>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <a href="Dir-A-Timer.dc.html" style="padding: 12px 14px; border-radius: 8px; background: {{t.sf}}; color: {{t.ink}}; text-decoration: none; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 12px; font-weight: 600; color: {{t.ink2}}">TABATA</span>
          <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 40px; font-weight: 800; line-height: 1">20<span style="color: {{t.ink2}}">/</span>10</span>
          <span style="font-size: 12px; color: {{t.ink2}}">{{s.t1}}</span>
        </a>
        <a href="Dir-A-Timer.dc.html" style="padding: 12px 14px; border-radius: 8px; background: {{t.sf}}; color: {{t.ink}}; text-decoration: none; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 12px; font-weight: 600; color: {{t.ink2}}">HIIT</span>
          <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 40px; font-weight: 800; line-height: 1">40<span style="color: {{t.ink2}}">/</span>20</span>
          <span style="font-size: 12px; color: {{t.ink2}}">{{s.t2}}</span>
        </a>
      </div>
    </section>
  </main>

  <div style="margin: 8px 16px; height: 50px; flex-shrink: 0; border: 1px dashed {{t.line}}; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: {{t.ink2}}">{{s.ad}}</div>

  <nav aria-label="{{s.navAria}}" style="height: 68px; flex-shrink: 0; background: {{t.nav}}; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
    <a href="Dir-A-Inicio.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: {{t.ink}}; font-size: 11px; font-weight: 600; letter-spacing: 0.6px; border-top: 3px solid {{t.navOn}}">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>{{s.nHome}}</a>
    <a href="S02-Entrenar.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: {{t.ink2}}; font-size: 11px; font-weight: 500; letter-spacing: 0.6px; border-top: 3px solid transparent">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 7v10M3 9v6M18 7v10M21 9v6M6 12h12"></path></svg>{{s.nTrain}}</a>
    <a href="S12-Historial.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: {{t.ink2}}; font-size: 11px; font-weight: 500; letter-spacing: 0.6px; border-top: 3px solid transparent">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>{{s.nHist}}</a>
    <a href="S14-Progreso.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: {{t.ink2}}; font-size: 11px; font-weight: 500; letter-spacing: 0.6px; border-top: 3px solid transparent">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 20V11M12 20V5M19 20v-6"></path></svg>{{s.nProg}}</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tema":{"editor":"enum","options":["oscuro","claro"],"default":"oscuro"},"idioma":{"editor":"enum","options":["es","en","pt"],"default":"es"},"$preview":{"width":390,"height":844}}'>
var TOK = {
  oscuro: { bg: '#0E0F11', sf: '#191B1E', ink: '#F2F3EF', ink2: '#A2A7AD', line: '#3A3E44', mark: '#D7FF3A', markInk: '#0E0F11', priBg: '#D7FF3A', priInk: '#0E0F11', barOn: '#D7FF3A', barOff: '#33373C', str: '#D7FF3A', nav: '#141518', navOn: '#D7FF3A' },
  claro: { bg: '#F2F2EE', sf: '#FFFFFF', ink: '#0E0F11', ink2: '#555A60', line: '#B9BBB4', mark: '#0E0F11', markInk: '#D7FF3A', priBg: '#0E0F11', priInk: '#D7FF3A', barOn: '#0E0F11', barOff: '#D6D7D1', str: '#0E0F11', nav: '#FFFFFF', navOn: '#0E0F11' }
};
var STR = {
  es: { settings: 'Ajustes', week: 'ESTA SEMANA', sessions: 'sesiones de tu objetivo', progressAria: '2 de 4 sesiones esta semana', mins: 'min activos', streak: 'semanas de racha', startInt: 'INTERVALOS', startStr: 'FUERZA', repeat: 'REPETIR ÚLTIMO', lastName: 'PIERNAS A', lastMeta: 'Fuerza · hace 2 días · 52 min', templates: 'PLANTILLAS', t1: '8 rondas · 4 min', t2: '12 rondas · 12 min', ad: 'Anuncio · banner', navAria: 'Navegación principal', nHome: 'INICIO', nTrain: 'ENTRENAR', nHist: 'HISTORIAL', nProg: 'PROGRESO' },
  en: { settings: 'Settings', week: 'THIS WEEK', sessions: 'sessions of your goal', progressAria: '2 of 4 sessions this week', mins: 'active min', streak: 'week streak', startInt: 'INTERVALS', startStr: 'STRENGTH', repeat: 'REPEAT LAST', lastName: 'LEGS A', lastMeta: 'Strength · 2 days ago · 52 min', templates: 'TEMPLATES', t1: '8 rounds · 4 min', t2: '12 rounds · 12 min', ad: 'Ad · banner', navAria: 'Main navigation', nHome: 'HOME', nTrain: 'TRAIN', nHist: 'HISTORY', nProg: 'PROGRESS' },
  pt: { settings: 'Ajustes', week: 'ESTA SEMANA', sessions: 'sessões da sua meta', progressAria: '2 de 4 sessões nesta semana', mins: 'min ativos', streak: 'semanas seguidas', startInt: 'INTERVALOS', startStr: 'FORÇA', repeat: 'REPETIR ÚLTIMO', lastName: 'PERNAS A', lastMeta: 'Força · há 2 dias · 52 min', templates: 'MODELOS', t1: '8 rodadas · 4 min', t2: '12 rodadas · 12 min', ad: 'Anúncio · banner', navAria: 'Navegação principal', nHome: 'INÍCIO', nTrain: 'TREINAR', nHist: 'HISTÓRICO', nProg: 'PROGRESSO' }
};
class Component extends DCLogic {
  renderVals() {
    var tema = this.props.tema ?? 'oscuro', idioma = this.props.idioma ?? 'es';
    return { t: TOK[tema] || TOK.oscuro, s: STR[idioma] || STR.es, lang: idioma === 'pt' ? 'pt-BR' : idioma };
  }
}
</script>
</body>
</html>
