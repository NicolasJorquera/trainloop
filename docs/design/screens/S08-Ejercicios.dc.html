<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>S08 · Biblioteca de ejercicios</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
</style>
</helmet>
<div lang="{{lang}}" style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.ink}}; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <header style="height: 64px; padding: 0 16px 0 4px; display: flex; align-items: center; gap: 4px; flex-shrink: 0">
    <a href="S07-EditorRutina.dc.html" aria-label="{{s.back}}" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: {{t.ink}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
    <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 800; text-transform: uppercase">{{s.title}}</h1>
  </header>

  <div style="padding: 0 16px; display: flex; flex-direction: column; gap: 10px; flex-shrink: 0">
    <label style="position: relative; display: block">
      <span style="position: absolute; left: 14px; top: 14px; color: {{t.ink2}}" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg></span>
      <input type="search" aria-label="{{s.search}}" placeholder="{{s.search}}" value="{{q}}" onChange="{{onQ}}" style="width: 100%; box-sizing: border-box; height: 48px; padding: 0 14px 0 44px; border: 1px solid {{t.line}}; border-radius: 6px; background: {{t.field}}; font-family: Inter, system-ui, sans-serif; font-size: 16px; color: {{t.ink}}">
    </label>
    <div style="display: flex; flex-wrap: wrap; gap: 6px" role="group" aria-label="{{s.filter}}">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="7">
        <button type="button" onClick="{{c.pick}}" aria-pressed="{{c.on}}" style="height: 36px; padding: 0 12px; border: 1px solid {{c.border}}; border-radius: 4px; background: {{c.bg}}; color: {{c.fg}}; font-family: 'Barlow Condensed', sans-serif; font-size: 16px; font-weight: 700; text-transform: uppercase; cursor: pointer">{{c.label}}</button>
      </sc-for>
    </div>
  </div>

  <main style="flex-grow: 1; padding: 12px 16px 8px; display: flex; flex-direction: column; gap: 6px; overflow: hidden">
    <sc-for list="{{list}}" as="x" hint-placeholder-count="8">
      <label style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 12px 0 14px; background: {{t.sf}}; border: 2px solid {{x.border}}; border-radius: 8px; cursor: pointer">
        <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px">
          <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 700; text-transform: uppercase">{{x.name}}</span>
          <span style="font-size: 13px; color: {{t.ink2}}">{{x.meta}}</span>
        </span>
        <input type="checkbox" checked="{{x.on}}" onChange="{{x.toggle}}" aria-label="{{x.aria}}" style="width: 22px; height: 22px; accent-color: {{t.acc}}">
      </label>
    </sc-for>
    <sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
      <div style="padding: 24px 16px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center">
        <span style="font-size: 16px; font-weight: 500">{{s.notFound}} «{{q}}»</span>
        <a href="S09-CrearEjercicio.dc.html" style="height: 48px; padding: 0 18px; border-radius: 6px; background: {{t.priBg}}; color: {{t.priInk}}; display: flex; align-items: center; font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 800; text-transform: uppercase; text-decoration: none">{{s.create}} «{{q}}»</a>
      </div>
    </sc-if>
    <a href="S09-CrearEjercicio.dc.html" style="height: 48px; display: flex; align-items: center; justify-content: center; color: {{t.accText}}; font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 700; text-transform: uppercase; text-decoration: none">+ {{s.custom}}</a>
  </main>

  <footer style="flex-shrink: 0; padding: 12px 16px 20px; background: {{t.sf}}">
    <sc-if value="{{hasSel}}" hint-placeholder-val="{{true}}">
      <a href="S07-EditorRutina.dc.html" style="height: 56px; border-radius: 6px; background: {{t.priBg}}; color: {{t.priInk}}; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-size: 24px; font-weight: 800; text-transform: uppercase; text-decoration: none">{{s.add}} {{count}}</a>
    </sc-if>
    <sc-if value="{{noSel}}" hint-placeholder-val="{{false}}">
      <span aria-disabled="true" style="height: 56px; border-radius: 6px; background: {{t.sf2}}; color: {{t.ink2}}; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 700; text-transform: uppercase">{{s.pick}}</span>
    </sc-if>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"acento":{"editor":"enum","options":["orquidea","rosa","rojo","naranja","amarillo","lima","azul","violeta"],"default":"orquidea"},"tema":{"editor":"enum","options":["oscuro","claro"],"default":"oscuro"},"idioma":{"editor":"enum","options":["es","en","pt"],"default":"es"},"$preview":{"width":390,"height":844}}'>
var TOK = {
  oscuro: { bg: '#0E0F11', sf: '#191B1E', sf2: '#22252A', ink: '#F2F3EF', ink2: '#A2A7AD', line: '#34383E', acc: '#D45CFF', accText: '#D45CFF', priBg: '#D45CFF', priInk: '#0E0F11', field: '#22252A' },
  claro: { bg: '#F2F2EE', sf: '#FFFFFF', sf2: '#E8E8E3', ink: '#0E0F11', ink2: '#555A60', line: '#C9CBC4', acc: '#8A2BBF', accText: '#8A2BBF', priBg: '#0E0F11', priInk: '#D45CFF', field: '#F2F2EE' }
};
var MUS = ['all', 'legs', 'chest', 'back', 'shoulders', 'arms', 'core'];
var DATA = [
  { n: ['Sentadilla', 'Squat', 'Agachamento'], m: 'legs', eq: 'bar' },
  { n: ['Zancadas', 'Lunges', 'Avanço'], m: 'legs', eq: 'db' },
  { n: ['Hip thrust', 'Hip thrust', 'Elevação pélvica'], m: 'legs', eq: 'bar' },
  { n: ['Extensión de cuádriceps', 'Leg extension', 'Cadeira extensora'], m: 'legs', eq: 'mach' },
  { n: ['Press de banca', 'Bench press', 'Supino reto'], m: 'chest', eq: 'bar' },
  { n: ['Press inclinado', 'Incline press', 'Supino inclinado'], m: 'chest', eq: 'db' },
  { n: ['Remo con barra', 'Barbell row', 'Remada curvada'], m: 'back', eq: 'bar' },
  { n: ['Dominadas', 'Pull-ups', 'Barra fixa'], m: 'back', eq: 'bw' },
  { n: ['Press militar', 'Overhead press', 'Desenvolvimento'], m: 'shoulders', eq: 'bar' },
  { n: ['Curl de bíceps', 'Biceps curl', 'Rosca direta'], m: 'arms', eq: 'db' },
  { n: ['Plancha', 'Plank', 'Prancha'], m: 'core', eq: 'bwt' }
];
var ACC = {
 orquidea:{n:{es:'Orquídea',en:'Orchid',pt:'Orquídea'},d:'#D45CFF',l:'#8A2BBF',sd:'#2E1B37',sl:'#F9E8FF'},
 rosa:{n:{es:'Rosa',en:'Pink',pt:'Rosa'},d:'#FF5CA8',l:'#B8216A',sd:'#351B29',sl:'#FFE8F3'},
 rojo:{n:{es:'Rojo',en:'Red',pt:'Vermelho'},d:'#FF5A5F',l:'#C2262E',sd:'#351B1E',sl:'#FFE8E9'},
 naranja:{n:{es:'Naranja',en:'Orange',pt:'Laranja'},d:'#FF8A3D',l:'#B4500F',sd:'#352318',sl:'#FFEFE4'},
 amarillo:{n:{es:'Amarillo',en:'Yellow',pt:'Amarelo'},d:'#FFD23F',l:'#8A6A00',sd:'#352E18',sl:'#FFF9E4'},
 lima:{n:{es:'Lima',en:'Lime',pt:'Lima'},d:'#A3E635',l:'#4D7C0F',sd:'#263117',sl:'#F2FCE3'},
 azul:{n:{es:'Azul',en:'Blue',pt:'Azul'},d:'#4D9FFF',l:'#1F5FC9',sd:'#182637',sl:'#E6F2FF'},
 violeta:{n:{es:'Violeta',en:'Violet',pt:'Violeta'},d:'#9B7BFF',l:'#5B3FD1',sd:'#252037',sl:'#F1ECFF'}
};
function phasesFor(k){ var a=ACC[k]||ACC.orquidea; var p={prep:{bg:'#0E0F11',ink:'#F2F3EF'},warm:{bg:'#FFB020',ink:'#0E0F11'},work:{bg:a.d,ink:'#0E0F11'},rest:{bg:'#2BD9C5',ink:'#0E0F11'},cool:{bg:'#4D9FFF',ink:'#0E0F11'}}; if(k==='lima'){p.rest.bg='#4D9FFF';p.cool.bg='#9B7BFF';} if(k==='amarillo'||k==='naranja'){p.warm.bg='#FF5CA8';} if(k==='azul'){p.cool.bg='#9B7BFF';} return p; }
function accTok(t,tema,k){ var a=ACC[k]||ACC.orquidea, o={}; for (var x in t) o[x]=t[x]; if(tema==='claro'){o.acc=a.l;o.accText=a.l;o.accSoft=a.sl;o.priBg='#0E0F11';o.priInk=a.d;o.barOn=a.l;o.navOn=a.l;} else {o.acc=a.d;o.accText=a.d;o.accSoft=a.sd;o.priBg=a.d;o.priInk='#0E0F11';o.barOn=a.d;o.navOn=a.d;} return o; }
var STR = {
  es: { i: 0, back: 'Volver', title: 'Agregar ejercicios', search: 'Buscar ejercicio', filter: 'Filtrar por músculo', notFound: 'No encontramos', create: 'Crear', custom: 'Crear ejercicio propio', add: 'Agregar', pick: 'Selecciona ejercicios', select: 'Seleccionar', mus: { all: 'Todos', legs: 'Piernas', chest: 'Pecho', back: 'Espalda', shoulders: 'Hombros', arms: 'Brazos', core: 'Core' }, eq: { bar: 'Barra', db: 'Mancuernas', mach: 'Máquina', bw: 'Peso corporal', bwt: 'Peso corporal · tiempo' } },
  en: { i: 1, back: 'Back', title: 'Add exercises', search: 'Search exercise', filter: 'Filter by muscle', notFound: 'No results for', create: 'Create', custom: 'Create custom exercise', add: 'Add', pick: 'Select exercises', select: 'Select', mus: { all: 'All', legs: 'Legs', chest: 'Chest', back: 'Back', shoulders: 'Shoulders', arms: 'Arms', core: 'Core' }, eq: { bar: 'Barbell', db: 'Dumbbells', mach: 'Machine', bw: 'Bodyweight', bwt: 'Bodyweight · time' } },
  pt: { i: 2, back: 'Voltar', title: 'Adicionar exercícios', search: 'Buscar exercício', filter: 'Filtrar por músculo', notFound: 'Nada encontrado para', create: 'Criar', custom: 'Criar exercício próprio', add: 'Adicionar', pick: 'Selecione exercícios', select: 'Selecionar', mus: { all: 'Todos', legs: 'Pernas', chest: 'Peito', back: 'Costas', shoulders: 'Ombros', arms: 'Braços', core: 'Core' }, eq: { bar: 'Barra', db: 'Halteres', mach: 'Máquina', bw: 'Peso corporal', bwt: 'Peso corporal · tempo' } }
};
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { q: '', muscle: 'all', sel: { 1: true, 2: true } };
  }
  renderVals() {
    var st = this.state, self = this;
    var tema = this.props.tema ?? 'oscuro', idioma = this.props.idioma ?? 'es';
    var acento = (this.state && this.state.acento) || this.props.acento || 'orquidea';
    var t = accTok(TOK[tema] || TOK.oscuro, tema, acento), s = STR[idioma] || STR.es;
    var q = (st.q || '').trim().toLowerCase();
    var idx = [];
    DATA.forEach(function (d, i) {
      if ((st.muscle === 'all' || d.m === st.muscle) && (!q || d.n[s.i].toLowerCase().indexOf(q) >= 0)) idx.push(i);
    });
    var list = idx.slice(0, 8).map(function (i) {
      var d = DATA[i], on = !!st.sel[i], nm = d.n[s.i];
      var nsel = Object.assign({}, st.sel); nsel[i] = !on;
      return { name: nm, meta: s.mus[d.m] + ' · ' + s.eq[d.eq], on: on, aria: s.select + ' ' + nm, border: on ? t.acc : 'transparent', toggle: function () { self.setState({ sel: nsel }); } };
    });
    var chips = MUS.map(function (m) {
      var on = st.muscle === m;
      return { label: s.mus[m], on: on, bg: on ? t.priBg : 'transparent', fg: on ? t.priInk : t.ink, border: on ? t.priBg : t.line, pick: function () { self.setState({ muscle: m }); } };
    });
    var count = Object.keys(st.sel).filter(function (k) { return st.sel[k]; }).length;
    return {
      t: t, s: s, lang: idioma === 'pt' ? 'pt-BR' : idioma,
      q: st.q,
      onQ: function (e) { self.setState({ q: e.target.value }); },
      chips: chips, list: list,
      empty: idx.length === 0,
      count: count, hasSel: count > 0, noSel: count === 0
    };
  }
}
</script>
</body>
</html>
