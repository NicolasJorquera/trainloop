<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>S19 · Notificación en curso</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&amp;family=Inter:wght@300;400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
</style>
</helmet>
<div lang="{{lang}}" style="width: 390px; height: 844px; box-sizing: border-box; background: #121316; color: #F2F3EF; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; padding: 72px 16px 24px; gap: 12px">
  <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; margin-bottom: 32px">
    <span style="font-size: 72px; font-weight: 300; font-variant-numeric: tabular-nums; line-height: 1">07:14</span>
    <span style="font-size: 16px; color: #A2A7AD">{{s.date}}</span>
    <span style="margin-top: 8px; font-size: 13px; color: #A2A7AD">{{s.locked}}</span>
  </div>

  <a href="S05-Temporizador.dc.html" style="display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border-radius: 20px; background: #24262B; color: #F2F3EF; text-decoration: none">
    <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #A2A7AD">
      <span style="width: 20px; height: 20px; border-radius: 4px; background: {{A}}; display: flex; align-items: center; justify-content: center" aria-hidden="true"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#0E0F11" stroke-width="3.2" stroke-linecap="round"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v4h4"></path></svg></span>
      <span>Trainloop · Tabata 20/10</span>
      <span style="margin-left: auto">{{s.ongoing}}</span>
    </div>
    <div style="display: flex; align-items: baseline; gap: 10px">
      <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 800; text-transform: uppercase; color: {{P.work.bg}}">▲ {{s.work}}</span>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 36px; font-weight: 800; font-variant-numeric: tabular-nums">0:14</span>
      <span style="margin-left: auto; font-size: 14px; color: #A2A7AD">{{s.round}}</span>
    </div>
    <div style="height: 4px; border-radius: 2px; background: #3A3D44; overflow: hidden" aria-hidden="true"><div style="width: 34%; height: 4px; background: {{P.work.bg}}"></div></div>
    <div style="display: flex; gap: 8px">
      <span style="height: 40px; padding: 0 18px; border-radius: 20px; background: #3A3D44; display: flex; align-items: center; font-size: 14px; font-weight: 600">{{s.pause}}</span>
      <span style="height: 40px; padding: 0 18px; border-radius: 20px; background: #3A3D44; display: flex; align-items: center; font-size: 14px; font-weight: 600">{{s.skip}}</span>
    </div>
  </a>

  <a href="S10-SesionFuerza.dc.html" style="display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border-radius: 20px; background: #24262B; color: #F2F3EF; text-decoration: none">
    <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #A2A7AD">
      <span style="width: 20px; height: 20px; border-radius: 4px; background: {{A}}; display: flex; align-items: center; justify-content: center" aria-hidden="true"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#0E0F11" stroke-width="3.2" stroke-linecap="round"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v4h4"></path></svg></span>
      <span>Trainloop · {{s.routine}}</span>
      <span style="margin-left: auto">{{s.strengthVariant}}</span>
    </div>
    <div style="display: flex; align-items: baseline; gap: 10px">
      <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 800; text-transform: uppercase; color: {{P.rest.bg}}">● {{s.rest}}</span>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 36px; font-weight: 800; font-variant-numeric: tabular-nums">1:05</span>
    </div>
    <div style="height: 4px; border-radius: 2px; background: #3A3D44; overflow: hidden" aria-hidden="true"><div style="width: 46%; height: 4px; background: {{P.rest.bg}}"></div></div>
    <span style="font-size: 14px; color: #A2A7AD">{{s.nextSet}}</span>
    <div style="display: flex; gap: 8px">
      <span style="height: 40px; padding: 0 18px; border-radius: 20px; background: #3A3D44; display: flex; align-items: center; font-size: 14px; font-weight: 600">+15 s</span>
      <span style="height: 40px; padding: 0 18px; border-radius: 20px; background: #3A3D44; display: flex; align-items: center; font-size: 14px; font-weight: 600">{{s.skip}}</span>
    </div>
  </a>

  <p style="margin: auto 0 0; font-size: 13px; color: #A2A7AD; line-height: 1.5">{{s.footnote}}</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"acento":{"editor":"enum","options":["orquidea","rosa","rojo","naranja","amarillo","lima","azul","violeta"],"default":"orquidea"},"tema":{"editor":"enum","options":["oscuro","claro"],"default":"oscuro"},"idioma":{"editor":"enum","options":["es","en","pt"],"default":"es"},"$preview":{"width":390,"height":844}}'>
