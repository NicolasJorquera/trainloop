      <span style="font-size: 12px; color: {{t.ink2}}">{{s.trendNote}}</span>
    </section>

    <section style="padding: 14px 16px; background: {{t.sf}}; border-radius: 8px; display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 12px; font-weight: 600; letter-spacing: 1.2px; color: {{t.ink2}}">{{s.records}}</span>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 12px; font-size: 14px; align-items: baseline">
        <span style="color: {{t.ink2}}">{{s.r1}}</span><span style="font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 700; text-align: right">{{s.r1v}}</span>

        <span style="color: {{t.ink2}}">{{s.r3}}</span><span style="font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 700; text-align: right">10</span>
        <span style="color: {{t.ink2}}">{{s.r4}}</span><span style="font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 700; text-align: right">{{s.r4v}}</span>

    </section>

      <span style="font-size: 12px; font-weight: 600; letter-spacing: 1.2px; color: {{t.ink2}}">{{s.history}}</span>
      <a href="S13-DetalleSesion.dc.html" style="display: flex; justify-content: space-between; align-items: center; min-height: 48px; padding: 0 14px; background: {{t.sf}}; border-radius: 8px; color: {{t.ink}}; text-decoration: none; font-size: 14px"><span>{{s.h1d}}</span><span style="color: {{t.ink2}}">80×8 · 80×8 · 85×8</span></a>

    </section>
  </main>
</div>
