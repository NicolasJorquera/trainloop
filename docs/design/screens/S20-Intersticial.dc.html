<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>S20 · Intersticial (experimento)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
</style>
</helmet>
<div lang="{{lang}}" style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.ink}}; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <div style="margin: 16px; padding: 12px 14px; border-radius: 8px; background: {{t.accSoft}}; border: 1px solid {{t.acc}}; font-size: 13px; line-height: 1.45">
    <strong style="font-family: 'Barlow Condensed', sans-serif; font-size: 17px; font-weight: 800; text-transform: uppercase; color: {{t.accText}}">{{s.expTitle}}</strong>
    <span style="display: block; margin-top: 2px">{{s.expBody}}</span>
  </div>

  <div style="flex-grow: 1; margin: 0 16px; border: 2px dashed {{t.line}}; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: {{t.ink2}}; text-align: center; padding: 24px">
    <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 30px; font-weight: 800; text-transform: uppercase; color: {{t.ink}}">{{s.ad}}</span>
    <span style="font-size: 14px">{{s.adSub}}</span>
    <span style="font-size: 13px">{{s.adRule}}</span>
  </div>

  <div style="flex-shrink: 0; padding: 16px; display: flex; justify-content: flex-end">
    <sc-if value="{{canClose}}" hint-placeholder-val="{{false}}">
      <a href="Main.dc.html" style="height: 52px; padding: 0 20px; border-radius: 6px; background: {{t.priBg}}; color: {{t.priInk}}; display: flex; align-items: center; gap: 8px; font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 800; text-transform: uppercase; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>{{s.close}}</a>
    </sc-if>
    <sc-if value="{{waiting}}" hint-placeholder-val="{{true}}">
      <span style="height: 52px; padding: 0 20px; border-radius: 6px; background: {{t.sf2}}; color: {{t.ink2}}; display: flex; align-items: center; font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 700; text-transform: uppercase">{{s.closeIn}} {{left}} s</span>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"acento":{"editor":"enum","options":["orquidea","rosa","rojo","naranja","amarillo","lima","azul","violeta"],"default":"orquidea"},"tema":{"editor":"enum","options":["oscuro","claro"],"default":"oscuro"},"idioma":{"editor":"enum","options":["es","en","pt"],"default":"es"},"$preview":{"width":390,"height":844}}'>
var TOK = {
  oscuro: { bg: '#0E0F11', sf: '#191B1E', sf2: '#22252A', ink: '#F2F3EF', ink2: '#A2A7AD', line: '#34383E', acc: '#D45CFF', accText: '#D45CFF', accSoft: '#2A1838', priBg: '#D45CFF', priInk: '#0E0F11' },
  claro: { bg: '#F2F2EE', sf: '#FFFFFF', sf2: '#E8E8E3', ink: '#0E0F11', ink2: '#555A60', line: '#C9CBC4', acc: '#8A2BBF', accText: '#8A2BBF', accSoft: '#F3E6FA', priBg: '#0E0F11', priInk: '#D45CFF' }
};
var ACC = {
 orquidea:{n:{es:'Orquídea',en:'Orchid',pt:'Orquídea'},d:'#D45CFF',l:'#8A2BBF',sd:'#2E1B37',sl:'#F9E8FF'},
 rosa:{n:{es:'Rosa',en:'Pink',pt:'Rosa'},d:'#FF5CA8',l:'#B8216A',sd:'#351B29',sl:'#FFE8F3'},
 rojo:{n:{es:'Rojo',en:'Red',pt:'Vermelho'},d:'#FF5A5F',l:'#C2262E',sd:'#351B1E',sl:'#FFE8E9'},
 naranja:{n:{es:'Naranja',en:'Orange',pt:'Laranja'},d:'#FF8A3D',l:'#B4500F',sd:'#352318',sl:'#FFEFE4'},
 amarillo:{n:{es:'Amarillo',en:'Yellow',pt:'Amarelo'},d:'#FFD23F',l:'#8A6A00',sd:'#352E18',sl:'#FFF9E4'},
 lima:{n:{es:'Lima',en:'Lime',pt:'Lima'},d:'#A3E635',l:'#4D7C0F',sd:'#263117',sl:'#F2FCE3'},
 azul:{n:{es:'Azul',en:'Blue',pt:'Azul'},d:'#4D9FFF',l:'#1F5FC9',sd:'#182637',sl:'#E6F2FF'},
 violeta:{n:{es:'Violeta',en:'Violet',pt:'Violeta'},d:'#9B7BFF',l:'#5B3FD1',sd:'#252037',sl:'#F1ECFF'}
};
function phasesFor(k){ var a=ACC[k]||ACC.orquidea; var p={prep:{bg:'#0E0F11',ink:'#F2F3EF'},warm:{bg:'#FFB020',ink:'#0E0F11'},work:{bg:a.d,ink:'#0E0F11'},rest:{bg:'#2BD9C5',ink:'#0E0F11'},cool:{bg:'#4D9FFF',ink:'#0E0F11'}}; if(k==='lima'){p.rest.bg='#4D9FFF';p.cool.bg='#9B7BFF';} if(k==='amarillo'||k==='naranja'){p.warm.bg='#FF5CA8';} if(k==='azul'){p.cool.bg='#9B7BFF';} return p; }
function accTok(t,tema,k){ var a=ACC[k]||ACC.orquidea, o={}; for (var x in t) o[x]=t[x]; if(tema==='claro'){o.acc=a.l;o.accText=a.l;o.accSoft=a.sl;o.priBg='#0E0F11';o.priInk=a.d;o.barOn=a.l;o.navOn=a.l;} else {o.acc=a.d;o.accText=a.d;o.accSoft=a.sd;o.priBg=a.d;o.priInk='#0E0F11';o.barOn=a.d;o.navOn=a.d;} return o; }
var STR = {
  es: { expTitle: 'Experimento, apagado por defecto (H4)', expBody: 'Solo tras tocar «Listo» en una sesión completada, con baja frecuencia y nunca después de cada entrenamiento. Pendiente de validar en la beta.', ad: 'Anuncio intersticial', adSub: 'Contenido del anunciante (AdMob)', adRule: 'Se puede cerrar a los 5 s · nunca durante una sesión', close: 'Cerrar anuncio', closeIn: 'Cerrar en' },
  en: { expTitle: 'Experiment, off by default (H4)', expBody: 'Only after tapping "Done" on a completed session, at low frequency and never after every workout. To be validated in the beta.', ad: 'Interstitial ad', adSub: 'Advertiser content (AdMob)', adRule: 'Can be closed after 5 s · never during a session', close: 'Close ad', closeIn: 'Close in' },
  pt: { expTitle: 'Experimento, desligado por padrão (H4)', expBody: 'Só depois de tocar em «Pronto» numa sessão concluída, com baixa frequência e nunca depois de cada treino. A validar na beta.', ad: 'Anúncio intersticial', adSub: 'Conteúdo do anunciante (AdMob)', adRule: 'Pode ser fechado após 5 s · nunca durante uma sessão', close: 'Fechar anúncio', closeIn: 'Fechar em' }
};
class Component extends DCLogic {
  componentDidMount() {
    this.t0 = Date.now();
    var self = this;
    this.iv = setInterval(function () { self.forceUpdate(); }, 250);
  }
  componentWillUnmount() {
    clearInterval(this.iv);
  }
  renderVals() {
    var tema = this.props.tema ?? 'oscuro', idioma = this.props.idioma ?? 'es';
    var acento = (this.state && this.state.acento) || this.props.acento || 'orquidea';
    var left = Math.max(0, 5 - Math.floor((Date.now() - (this.t0 || Date.now())) / 1000));
    return { t: accTok(TOK[tema] || TOK.oscuro, tema, acento), s: STR[idioma] || STR.es, lang: idioma === 'pt' ? 'pt-BR' : idioma, left: left, canClose: left === 0, waiting: left > 0 };
  }
}
</script>
</body>
</html>
