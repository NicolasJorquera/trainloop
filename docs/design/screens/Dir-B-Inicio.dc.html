<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>B · Inicio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&amp;family=Archivo:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
</style>
</helmet>
<div lang="{{lang}}" style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.ink}}; font-family: Archivo, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="height: 60px; padding: 0 8px 0 16px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; border-bottom: 1px solid {{t.line}}">
    <span style="font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 18px; letter-spacing: -0.5px">trainloop<span style="color: {{t.work}}">_</span></span>
    <a href="S16-Configuracion.dc.html" aria-label="{{s.settings}}" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: {{t.ink}}">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>
    </a>
  </header>

  <main style="flex-grow: 1; padding: 14px 16px 0; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
    <section style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 1px; color: {{t.ink2}}">{{s.week}}</span>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 800">2/4</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px" role="img" aria-label="{{s.weekAria}}">
        <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
          <div style="display: flex; flex-direction: column; gap: 4px; align-items: stretch">
            <span style="height: 44px; border-radius: 2px; background: {{d.bg}}; border: 2px {{d.bs}} {{d.bc}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 800; color: #FFFFFF">{{d.mark}}</span>
            <span style="text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: {{t.ink2}}">{{d.l}}</span>
          </div>
        </sc-for>
      </div>
      <span style="font-size: 13px; color: {{t.ink2}}">{{s.legend}}</span>
    </section>

    <a href="Dir-B-Timer.dc.html" style="height: 112px; padding: 14px 16px; box-sizing: border-box; border-radius: 2px; background: {{t.work}}; color: #FFFFFF; text-decoration: none; display: flex; justify-content: space-between">
      <span style="display: flex; flex-direction: column; justify-content: space-between">
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 1px">{{s.int}}</span>
        <span style="font-size: 26px; font-weight: 700; line-height: 1.05">{{s.startInt}}</span>
      </span>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 44px; font-weight: 800; align-self: flex-end; line-height: 1">20:10</span>
    </a>
    <a href="S10-SesionFuerza.dc.html" style="height: 112px; padding: 14px 16px; box-sizing: border-box; border-radius: 2px; background: {{t.str}}; color: #FFFFFF; text-decoration: none; display: flex; justify-content: space-between">
      <span style="display: flex; flex-direction: column; justify-content: space-between">
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 1px">{{s.str}}</span>
        <span style="font-size: 26px; font-weight: 700; line-height: 1.05">{{s.lastName}}</span>
      </span>
      <span style="align-self: flex-end; text-align: right; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; line-height: 1.5">5 EX<br>18 SETS<br>~52 MIN</span>
    </a>

    <section style="display: flex; flex-direction: column; gap: 0; border-top: 1px solid {{t.line}}">
      <a href="Dir-B-Timer.dc.html" style="display: flex; align-items: center; gap: 12px; height: 52px; border-bottom: 1px solid {{t.line}}; text-decoration: none; color: {{t.ink}}">
        <span style="width: 12px; height: 12px; background: {{t.work}}" aria-hidden="true"></span>
        <span style="flex-grow: 1; font-size: 16px; font-weight: 600">HIIT</span>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 700">40/20 ×12</span>
      </a>
      <a href="Dir-B-Timer.dc.html" style="display: flex; align-items: center; gap: 12px; height: 52px; border-bottom: 1px solid {{t.line}}; text-decoration: none; color: {{t.ink}}">
        <span style="width: 12px; height: 12px; background: {{t.work}}" aria-hidden="true"></span>
        <span style="flex-grow: 1; font-size: 16px; font-weight: 600">EMOM</span>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 700">1:00 ×10</span>
      </a>
      <a href="Dir-B-Timer.dc.html" style="display: flex; align-items: center; gap: 12px; height: 52px; border-bottom: 1px solid {{t.line}}; text-decoration: none; color: {{t.ink}}">
        <span style="width: 12px; height: 12px; background: {{t.warm}}" aria-hidden="true"></span>
        <span style="flex-grow: 1; font-size: 16px; font-weight: 600">{{s.run}}</span>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 700">6×400</span>
      </a>
    </section>
  </main>

  <div style="margin: 8px 16px; height: 50px; flex-shrink: 0; border: 1px dashed {{t.line}}; display: flex; align-items: center; justify-content: center; font-size: 12px; color: {{t.ink2}}">{{s.ad}}</div>

  <nav aria-label="{{s.navAria}}" style="height: 64px; flex-shrink: 0; border-top: 1px solid {{t.line}}; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); font-family: 'JetBrains Mono', monospace">
    <a href="Dir-B-Inicio.dc.html" aria-current="page" style="display: flex; align-items: center; justify-content: center; text-decoration: none; color: {{t.bg}}; background: {{t.ink}}; font-size: 12px; font-weight: 700">{{s.nHome}}</a>
    <a href="S02-Entrenar.dc.html" style="display: flex; align-items: center; justify-content: center; text-decoration: none; color: {{t.ink2}}; font-size: 12px; font-weight: 700">{{s.nTrain}}</a>
    <a href="S12-Historial.dc.html" style="display: flex; align-items: center; justify-content: center; text-decoration: none; color: {{t.ink2}}; font-size: 12px; font-weight: 700">{{s.nHist}}</a>
    <a href="S14-Progreso.dc.html" style="display: flex; align-items: center; justify-content: center; text-decoration: none; color: {{t.ink2}}; font-size: 12px; font-weight: 700">{{s.nProg}}</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tema":{"editor":"enum","options":["oscuro","claro"],"default":"oscuro"},"idioma":{"editor":"enum","options":["es","en","pt"],"default":"es"},"$preview":{"width":390,"height":844}}'>
var TOK = {
  oscuro: { bg: '#121417', ink: '#F1F3F5', ink2: '#9AA2AC', line: '#2C3138', work: '#E8590C', str: '#1971C2', warm: '#F59F00', off: '#2C3138' },
  claro: { bg: '#FFFFFF', ink: '#121417', ink2: '#545B65', line: '#D5D9DE', work: '#D9480F', str: '#1864AB', warm: '#E67700', off: '#D5D9DE' }
};
var STR = {
  es: { settings: 'Ajustes', week: 'SEMANA', weekAria: 'Semana: lunes fuerza hecho, martes intervalos hecho, jueves y viernes planificados', legend: 'Lleno = hecho · contorno = planificado', int: 'INTERVALOS', startInt: 'Empezar Tabata', str: 'FUERZA', lastName: 'Piernas A', run: 'Carrera por tiempo', ad: 'Anuncio · banner', navAria: 'Navegación principal', nHome: 'INICIO', nTrain: 'ENTRENAR', nHist: 'HISTORIAL', nProg: 'PROGRESO', days: ['L', 'M', 'M', 'J', 'V', 'S', 'D'] },
  en: { settings: 'Settings', week: 'WEEK', weekAria: 'Week: Monday strength done, Tuesday intervals done, Thursday and Friday planned', legend: 'Filled = done · outline = planned', int: 'INTERVALS', startInt: 'Start Tabata', str: 'STRENGTH', lastName: 'Legs A', run: 'Timed run', ad: 'Ad · banner', navAria: 'Main navigation', nHome: 'HOME', nTrain: 'TRAIN', nHist: 'HISTORY', nProg: 'PROGRESS', days: ['M', 'T', 'W', 'T', 'F', 'S', 'S'] },
  pt: { settings: 'Ajustes', week: 'SEMANA', weekAria: 'Semana: segunda força feita, terça intervalos feitos, quinta e sexta planejados', legend: 'Cheio = feito · contorno = planejado', int: 'INTERVALOS', startInt: 'Iniciar Tabata', str: 'FORÇA', lastName: 'Pernas A', run: 'Corrida por tempo', ad: 'Anúncio · banner', navAria: 'Navegação principal', nHome: 'INÍCIO', nTrain: 'TREINAR', nHist: 'HISTÓRICO', nProg: 'PROGRESSO', days: ['S', 'T', 'Q', 'Q', 'S', 'S', 'D'] }
};
class Component extends DCLogic {
  renderVals() {
    var tema = this.props.tema ?? 'oscuro', idioma = this.props.idioma ?? 'es';
    var t = TOK[tema] || TOK.oscuro, s = STR[idioma] || STR.es;
    var plan = [['F', true], ['I', true], ['', false], ['F', false], ['I', false], ['', false], ['', false]];
    var days = plan.map(function (p, i) {
      var c = p[0] === 'F' ? t.str : p[0] === 'I' ? t.work : t.off;
      return { l: s.days[i], mark: p[1] ? p[0] : '', bg: p[1] ? c : 'transparent', bc: c, bs: p[0] && !p[1] ? 'solid' : p[1] ? 'solid' : 'dotted' };
    });
    return { t: t, s: s, days: days, lang: idioma === 'pt' ? 'pt-BR' : idioma };
  }
}
</script>
</body>
</html>
