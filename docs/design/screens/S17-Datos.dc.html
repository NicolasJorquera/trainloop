<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>S17 · Datos y respaldo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
</style>
</helmet>
<div lang="{{lang}}" style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.ink}}; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <header style="height: 64px; padding: 0 16px 0 4px; display: flex; align-items: center; gap: 4px; flex-shrink: 0">
    <a href="S16-Configuracion.dc.html" aria-label="{{s.back}}" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: {{t.ink}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
    <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 28px; font-weight: 800; letter-spacing: 0.3px">{{s.title}}</h1>
  </header>

  <main style="flex-grow: 1; padding: 0 16px 24px; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
    <section style="padding: 16px; background: {{t.sf}}; border-radius: 8px; display: flex; flex-direction: column; gap: 6px">
      <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 700">{{s.headline}}</span>
      <span style="font-size: 14px; color: {{t.ink2}}; line-height: 1.45">{{s.body}}</span>
      <span style="margin-top: 6px; font-size: 13px; color: {{t.ink2}}">{{s.lastBackup}}</span>
    </section>

    <button type="button" onClick="{{backup}}" style="height: 56px; border: 0; border-radius: 6px; background: {{t.priBg}}; color: {{t.priInk}}; font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 800; letter-spacing: 0.6px; cursor: pointer">{{s.create}}</button>
    <button type="button" onClick="{{restore}}" style="height: 52px; border: 2px solid {{t.ink}}; border-radius: 6px; background: transparent; color: {{t.ink}}; font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 700; letter-spacing: 0.6px; cursor: pointer">{{s.restoreBtn}}</button>
    <button type="button" style="height: 52px; border: 2px solid {{t.ink}}; border-radius: 6px; background: transparent; color: {{t.ink}}; font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 700; letter-spacing: 0.6px; cursor: pointer">{{s.csv}}</button>

    <section style="padding: 14px 16px; background: {{t.sf}}; border-radius: 8px; display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 12px; font-weight: 600; letter-spacing: 1.2px; color: {{t.ink2}}">{{s.howTitle}}</span>
      <ol style="margin: 0; padding-left: 18px; font-size: 14px; color: {{t.ink}}; line-height: 1.6">
        <li>{{s.step1}}</li>
        <li>{{s.step2}}</li>
        <li>{{s.step3}}</li>
      </ol>
    </section>

    <sc-if value="{{saved}}" hint-placeholder-val="{{false}}">
      <div role="status" style="height: 48px; padding: 0 16px; border-radius: 6px; background: {{t.okSoft}}; color: {{t.ok}}; display: flex; align-items: center; font-size: 14px; font-weight: 500">{{s.saved}}</div>
    </sc-if>
  </main>

  <sc-if value="{{confirm}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box">
      <div role="alertdialog" aria-label="{{s.dTitle}}" style="width: 100%; padding: 24px; background: {{t.sf}}; border-radius: 8px; display: flex; flex-direction: column; gap: 12px">
        <h2 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 800">{{s.dTitle}}</h2>
        <p style="margin: 0; font-size: 15px; color: {{t.ink}}">{{s.dSummary}}</p>
        <p style="margin: 0; font-size: 14px; color: {{t.ink2}}">{{s.dWarn}}</p>
        <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px">
          <button type="button" onClick="{{cancel}}" style="height: 48px; padding: 0 16px; border: 0; border-radius: 6px; background: transparent; color: {{t.ink}}; font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 700; cursor: pointer">{{s.cancel}}</button>
          <button type="button" onClick="{{cancel}}" style="height: 48px; padding: 0 18px; border: 0; border-radius: 6px; background: {{t.danger}}; color: {{t.onDanger}}; font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 700; cursor: pointer">{{s.restore}}</button>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"acento":{"editor":"enum","options":["orquidea","rosa","rojo","naranja","amarillo","lima","azul","violeta"],"default":"orquidea"},"tema":{"editor":"enum","options":["oscuro","claro"],"default":"oscuro"},"idioma":{"editor":"enum","options":["es","en","pt"],"default":"es"},"$preview":{"width":390,"height":844}}'>

  pt: { back: 'Voltar', title: 'BACKUP', headline: 'SEUS DADOS FICAM SÓ NESTE CELULAR', body: 'O Trainloop não tem conta nem servidor. Crie um backup e guarde onde quiser (Drive, Downloads ou envie para você) para não perder seu histórico.', lastBackup: 'Último backup: 21 out 2026 · 46 sessões · 182 KB', create: 'CRIAR BACKUP', restoreBtn: 'RESTAURAR BACKUP', csv: 'EXPORTAR CSV', howTitle: 'COMO SALVAR NO GOOGLE DRIVE', step1: 'Toque em “Criar backup”.', step2: 'No menu do Android escolha “Salvar no Drive”.', step3: 'No celular novo, toque em “Restaurar backup” e escolha o arquivo.', saved: 'Backup criado: trainloop-2026-11-02.json', dTitle: 'Restaurar este backup?', dSummary: 'Backup de 28 out 2026: 46 sessões, 5 rotinas, 3 treinos de intervalos.', dWarn: 'Ele vai substituir seus dados atuais. Antes salvaremos uma cópia automática do que você tem agora.', cancel: 'CANCELAR', restore: 'RESTAURAR' }

class Component extends DCLogic {

    var acento = (this.state && this.state.acento) || this.props.acento || 'orquidea';

</script>
</body>
</html>
