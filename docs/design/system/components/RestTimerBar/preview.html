<!-- @dsCard group="Sesión" height=120 subtitle="Descanso automático tras completar una serie" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@500;600&display=swap">
<div style="padding:16px;background:var(--bg)">
  <div role="timer" style="max-width:390px;box-sizing:border-box;padding:10px 16px;border-radius:var(--radius-md);background:var(--phase-rest);color:var(--phase-rest-ink);display:flex;align-items:center;gap:8px;font-family:var(--font-body)">
    <div style="flex:1;display:flex;flex-direction:column">
      <span style="font-size:12px;font-weight:600;letter-spacing:1px">● DESCANSO</span>
      <span style="font-family:var(--font-display);font-size:40px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums">1:24</span>
    </div>
    <button type="button" aria-label="Restar 15 segundos" style="width:56px;height:48px;border:0;border-radius:var(--radius-md);background:rgba(14,15,17,.15);color:var(--phase-rest-ink);font-family:var(--font-display);font-size:20px;font-weight:700">−15</button>
    <button type="button" aria-label="Sumar 15 segundos" style="width:56px;height:48px;border:0;border-radius:var(--radius-md);background:rgba(14,15,17,.15);color:var(--phase-rest-ink);font-family:var(--font-display);font-size:20px;font-weight:700">+15</button>
    <button type="button" style="height:48px;padding:0 14px;border:0;border-radius:var(--radius-md);background:var(--phase-rest-ink);color:var(--phase-rest);font-family:var(--font-display);font-size:20px;font-weight:800">SALTAR</button>
  </div>
</div>
