<!-- @dsCard group="Sesión" height=250 subtitle="Calentamiento, completada y pendiente" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600&display=swap">
<div style="padding:16px;background:var(--bg);font-family:var(--font-body)">
  <div style="max-width:360px;padding:12px 8px 8px;border-radius:var(--radius-lg);background:var(--surface-1);color:var(--ink);display:flex;flex-direction:column;gap:4px">
    <div style="padding:0 8px 4px;font-family:var(--font-display);font-size:22px;font-weight:700;color:var(--accent)">SENTADILLA</div>
    <div style="display:grid;grid-template-columns:40px minmax(0,1fr) 68px 60px 52px;padding:0 8px;font-size:11px;font-weight:600;letter-spacing:1px;color:var(--ink-muted)"><span>SERIE</span><span>ANTERIOR</span><span style="text-align:center">KG</span><span style="text-align:center">REPS</span><span></span></div>
    <div style="display:grid;grid-template-columns:40px minmax(0,1fr) 68px 60px 52px;align-items:center;min-height:52px;padding:0 8px;border-radius:var(--radius-sm);background:var(--success-soft)">
      <span style="font-family:var(--font-display);font-size:18px;font-weight:800;color:var(--warning)">C</span><span style="font-size:13px;color:var(--ink-muted)">40 × 10</span>
      <span style="margin:0 4px;height:40px;border-radius:var(--radius-sm);background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:20px;font-weight:700">40</span>
      <span style="margin:0 4px;height:40px;border-radius:var(--radius-sm);background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:20px;font-weight:700">10</span>
      <span style="justify-self:end;width:44px;height:44px;border-radius:var(--radius-md);background:var(--success);color:var(--bg);display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
    </div>
    <div style="display:grid;grid-template-columns:40px minmax(0,1fr) 68px 60px 52px;align-items:center;min-height:52px;padding:0 8px;border-radius:var(--radius-sm);background:var(--success-soft)">
      <span style="font-family:var(--font-display);font-size:18px;font-weight:800">1</span><span style="font-size:13px;color:var(--ink-muted)">80 × 8</span>
      <span style="margin:0 4px;height:40px;border-radius:var(--radius-sm);background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:20px;font-weight:700">80</span>
      <span style="margin:0 4px;height:40px;border-radius:var(--radius-sm);background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:20px;font-weight:700">8</span>
      <span style="justify-self:end;width:44px;height:44px;border-radius:var(--radius-md);background:var(--success);color:var(--bg);display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
    </div>
    <div style="display:grid;grid-template-columns:40px minmax(0,1fr) 68px 60px 52px;align-items:center;min-height:52px;padding:0 8px">
      <span style="font-family:var(--font-display);font-size:18px;font-weight:800">2</span><span style="font-size:13px;color:var(--ink-muted)">80 × 8</span>
      <span style="margin:0 4px;height:40px;border-radius:var(--radius-sm);background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:20px;font-weight:700;color:var(--ink-muted)">80</span>
      <span style="margin:0 4px;height:40px;border-radius:var(--radius-sm);background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:20px;font-weight:700;color:var(--ink-muted)">8</span>
      <span style="justify-self:end;width:44px;height:44px;box-sizing:border-box;border:2px solid var(--line);border-radius:var(--radius-md)"></span>
    </div>
  </div>
</div>
