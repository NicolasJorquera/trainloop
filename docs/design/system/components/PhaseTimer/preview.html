<!-- @dsCard group="Sesión" height=420 subtitle="Trabajo y descanso, iguales en ambos temas" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;1,800&family=Inter:wght@400;500;600&display=swap">
<div style="display:flex;flex-wrap:wrap;gap:16px;padding:16px;background:var(--bg)">
  <div style="width:240px;height:380px;box-sizing:border-box;padding:16px;border-radius:var(--radius-lg);background:var(--phase-work);color:var(--phase-work-ink);display:flex;flex-direction:column;font-family:var(--font-body)">
    <div style="display:flex;gap:2px;height:4px"><span style="flex:1;background:var(--phase-work-ink)"></span><span style="flex:2;background:var(--phase-work-ink)"></span><span style="flex:1;background:var(--phase-work-ink);opacity:.7"></span><span style="flex:2;background:var(--phase-work-ink);opacity:.25"></span><span style="flex:1;background:var(--phase-work-ink);opacity:.25"></span></div>
    <div style="margin-top:8px;display:flex;justify-content:space-between;font-size:11px;font-weight:600;letter-spacing:1px"><span>TABATA 20/10</span><span>RONDA 3/8</span></div>
    <div style="flex:1;display:flex;flex-direction:column;justify-content:center">
      <span style="font-family:var(--font-display);font-style:italic;font-weight:800;font-size:34px;line-height:.9">▲ TRABAJO</span>
      <span style="font-family:var(--font-display);font-weight:800;font-size:112px;line-height:.85;letter-spacing:-2px;font-variant-numeric:tabular-nums">0:12</span>
      <span style="margin-top:6px;font-size:13px;font-weight:500">Siguiente: Descanso 0:10</span>
    </div>
    <div style="display:flex;gap:8px;align-items:center;justify-content:space-between">
      <span style="width:44px;height:44px;border:2px solid var(--phase-work-ink);border-radius:var(--radius-md)"></span>
      <span style="width:96px;height:56px;border-radius:var(--radius-md);background:var(--phase-work-ink)"></span>
      <span style="width:44px;height:44px;border:2px solid var(--phase-work-ink);border-radius:var(--radius-md)"></span>
    </div>
  </div>
  <div style="width:240px;height:380px;box-sizing:border-box;padding:16px;border-radius:var(--radius-lg);background:var(--phase-rest);color:var(--phase-rest-ink);display:flex;flex-direction:column;font-family:var(--font-body)">
    <div style="display:flex;gap:2px;height:4px"><span style="flex:1;background:var(--phase-rest-ink)"></span><span style="flex:2;background:var(--phase-rest-ink)"></span><span style="flex:1;background:var(--phase-rest-ink)"></span><span style="flex:2;background:var(--phase-rest-ink);opacity:.7"></span><span style="flex:1;background:var(--phase-rest-ink);opacity:.25"></span></div>
    <div style="margin-top:8px;display:flex;justify-content:space-between;font-size:11px;font-weight:600;letter-spacing:1px"><span>TABATA 20/10</span><span>RONDA 3/8</span></div>
    <div style="flex:1;display:flex;flex-direction:column;justify-content:center">
      <span style="font-family:var(--font-display);font-style:italic;font-weight:800;font-size:34px;line-height:.9">● DESCANSO</span>
      <span style="font-family:var(--font-display);font-weight:800;font-size:112px;line-height:.85;letter-spacing:-2px;font-variant-numeric:tabular-nums">0:07</span>
      <span style="margin-top:6px;font-size:13px;font-weight:500">Siguiente: Trabajo 0:20</span>
    </div>
    <div style="display:flex;gap:8px;align-items:center;justify-content:space-between">
      <span style="width:44px;height:44px;border:2px solid var(--phase-rest-ink);border-radius:var(--radius-md)"></span>
      <span style="width:96px;height:56px;border-radius:var(--radius-md);background:var(--phase-rest-ink)"></span>
      <span style="width:44px;height:44px;border:2px solid var(--phase-rest-ink);border-radius:var(--radius-md)"></span>
    </div>
  </div>
</div>
