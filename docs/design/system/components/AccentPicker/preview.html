<!-- @dsCard group="Configuración" height=330 subtitle="8 acentos de intensidad similar, con vista previa de fases" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;1,800&family=Inter:wght@500;600&display=swap">
<div style="padding:16px;background:var(--bg);font-family:var(--font-body);color:var(--ink)">
  <div style="max-width:358px;display:flex;flex-direction:column;gap:10px">
    <span style="font-size:12px;font-weight:600;letter-spacing:1.2px;color:var(--ink-muted)">COLOR DE ACENTO</span>
    <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px">
      <button type="button" aria-pressed="true" style="height:72px;border:0;border-radius:var(--radius-md);background:transparent;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0;color:var(--ink);font-family:var(--font-body);font-size:12px;font-weight:600"><span style="width:44px;height:44px;border-radius:var(--radius-md);background:var(--accent-orquidea);box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--ink);display:flex;align-items:center;justify-content:center;color:var(--phase-work-ink)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>Orquídea</button>
      <button type="button" aria-pressed="false" style="height:72px;border:0;border-radius:var(--radius-md);background:transparent;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0;color:var(--ink-muted);font-family:var(--font-body);font-size:12px;font-weight:500"><span style="width:44px;height:44px;border-radius:var(--radius-md);background:var(--accent-rosa)"></span>Rosa</button>
      <button type="button" aria-pressed="false" style="height:72px;border:0;border-radius:var(--radius-md);background:transparent;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0;color:var(--ink-muted);font-family:var(--font-body);font-size:12px;font-weight:500"><span style="width:44px;height:44px;border-radius:var(--radius-md);background:var(--accent-rojo)"></span>Rojo</button>
      <button type="button" aria-pressed="false" style="height:72px;border:0;border-radius:var(--radius-md);background:transparent;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0;color:var(--ink-muted);font-family:var(--font-body);font-size:12px;font-weight:500"><span style="width:44px;height:44px;border-radius:var(--radius-md);background:var(--accent-naranja)"></span>Naranja</button>
      <button type="button" aria-pressed="false" style="height:72px;border:0;border-radius:var(--radius-md);background:transparent;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0;color:var(--ink-muted);font-family:var(--font-body);font-size:12px;font-weight:500"><span style="width:44px;height:44px;border-radius:var(--radius-md);background:var(--accent-amarillo)"></span>Amarillo</button>
      <button type="button" aria-pressed="false" style="height:72px;border:0;border-radius:var(--radius-md);background:transparent;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0;color:var(--ink-muted);font-family:var(--font-body);font-size:12px;font-weight:500"><span style="width:44px;height:44px;border-radius:var(--radius-md);background:var(--accent-lima)"></span>Lima</button>
      <button type="button" aria-pressed="false" style="height:72px;border:0;border-radius:var(--radius-md);background:transparent;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0;color:var(--ink-muted);font-family:var(--font-body);font-size:12px;font-weight:500"><span style="width:44px;height:44px;border-radius:var(--radius-md);background:var(--accent-azul)"></span>Azul</button>
      <button type="button" aria-pressed="false" style="height:72px;border:0;border-radius:var(--radius-md);background:transparent;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0;color:var(--ink-muted);font-family:var(--font-body);font-size:12px;font-weight:500"><span style="width:44px;height:44px;border-radius:var(--radius-md);background:var(--accent-violeta)"></span>Violeta</button>
    </div>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:4px">
      <span style="height:48px;border-radius:var(--radius-md);background:var(--phase-work);color:var(--phase-work-ink);display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-display);font-size:20px;font-weight:800">▲ TRABAJO 0:20</span>
      <span style="height:48px;border-radius:var(--radius-md);background:var(--phase-rest);color:var(--phase-rest-ink);display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-display);font-size:20px;font-weight:800">● DESCANSO 0:10</span>
    </div>
    <span style="font-size:13px;color:var(--ink-muted)">Cambia el color de botones, barras y la fase de trabajo. Todos tienen el mismo contraste.</span>
  </div>
</div>
