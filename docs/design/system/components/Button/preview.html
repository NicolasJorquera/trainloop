<!-- @dsCard group="Acciones" height=132 subtitle="Principal, secundario y texto" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;1,800&family=Inter:wght@400;500;600&display=swap">
<div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:16px;background:var(--bg);font-family:var(--font-body)">
  <button type="button" style="height:56px;padding:0 28px;border:0;border-radius:var(--radius-md);background:var(--primary-bg);color:var(--primary-ink);font-family:var(--font-display);font-size:22px;font-weight:800;letter-spacing:.3px;cursor:pointer">EMPEZAR</button>
  <button type="button" style="height:56px;padding:0 24px;border:2px solid var(--ink);border-radius:var(--radius-md);background:transparent;color:var(--ink);font-family:var(--font-display);font-size:22px;font-weight:800;letter-spacing:.3px;cursor:pointer">EDITAR</button>
  <button type="button" style="height:48px;padding:0 12px;border:0;background:transparent;color:var(--accent);font-family:var(--font-body);font-size:15px;font-weight:600;cursor:pointer">Omitir</button>
  <button type="button" style="height:48px;padding:0 12px;border:0;background:transparent;color:var(--danger);font-family:var(--font-body);font-size:15px;font-weight:600;cursor:pointer">Descartar sesión</button>
</div>
